    <style>
        :root {
            --dept-syllabus-primary: #10b981;
            --dept-syllabus-primary-dark: #059669;
            --dept-syllabus-primary-light: #ecfdf5;
            --dept-syllabus-bg: #F8FFF9;
            --dept-syllabus-text: #202122;
            --dept-syllabus-text-muted: #54595d;
            --dept-syllabus-border: #a2a9b1;
            --dept-syllabus-card-bg: #ffffff;
            --dept-syllabus-radius: 8px;
            --dept-syllabus-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --dept-syllabus-transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body.dept-syllabus-body {
            background-color: var(--dept-syllabus-bg);
            color: var(--dept-syllabus-text);
            line-height: 1.6;
            padding: 40px 20px;
            margin-top: 20px;
        }

        .dept-syllabus-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: var(--dept-syllabus-radius);
            box-shadow: var(--dept-syllabus-shadow);
            margin-top: 50px;
            margin-bottom: 50px;
        }

        /* Top Section */
        .dept-syllabus-header {
            border-bottom: 2px solid var(--dept-syllabus-primary);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dept-syllabus-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #000000;
            margin-bottom: 5px;
        }

        .dept-syllabus-subtitle {
            font-size: 0.95rem;
            color: var(--dept-syllabus-text-muted);
        }

        /* View Toggle Toolbar Elements */
        .dept-syllabus-view-controls {
            display: flex;
            background: #f8f9fa;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: 4px;
            overflow: hidden;
        }

        .dept-syllabus-view-btn {
            background: transparent;
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--dept-syllabus-text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-view-btn.active {
            background: var(--dept-syllabus-primary);
            color: #ffffff;
        }

        /* Toolbar / Filter Bar */
        .dept-syllabus-toolbar {
            background: #f8f9fa;
            border: 1px solid var(--dept-syllabus-border);
            padding: 15px;
            border-radius: var(--dept-syllabus-radius);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .dept-syllabus-search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .dept-syllabus-search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dept-syllabus-text-muted);
        }

        .dept-syllabus-search-input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-search-input:focus {
            border-color: var(--dept-syllabus-primary);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
        }

        .dept-syllabus-select {
            padding: 9px 12px;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: 4px;
            font-size: 0.9rem;
            background: #ffffff;
            cursor: pointer;
            outline: none;
        }

        .dept-syllabus-btn-reset {
            padding: 9px 16px;
            background: #eaecf0;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--dept-syllabus-text);
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-btn-reset:hover {
            background: #d0d2d6;
        }

        /* Tabs Section */
        .dept-syllabus-tabs-container {
            margin-bottom: 25px;
        }

        .dept-syllabus-section-heading {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dept-syllabus-text);
            border-bottom: 1px solid #eaecf0;
            padding-bottom: 4px;
        }

        .dept-syllabus-programme-tabs, .dept-syllabus-semester-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .dept-syllabus-tab {
            padding: 6px 14px;
            background: #f8f9fa;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--dept-syllabus-text);
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-tab:hover {
            background: #eaecf0;
        }

        .dept-syllabus-tab.active {
            background: var(--dept-syllabus-primary);
            color: #ffffff;
            border-color: var(--dept-syllabus-primary-dark);
            font-weight: 500;
        }

        /* Layout Views Container */
        .dept-syllabus-container {
            transition: var(--dept-syllabus-transition);
        }

        /* LIST VIEW (Default) */
        .dept-syllabus-container.list-view {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dept-syllabus-container.list-view .dept-syllabus-card {
            background: #ffffff;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: var(--dept-syllabus-radius);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-container.list-view .dept-syllabus-card:hover {
            border-color: var(--dept-syllabus-primary);
            box-shadow: var(--dept-syllabus-shadow);
        }

        /* GRID VIEW */
        .dept-syllabus-container.grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .dept-syllabus-container.grid-view .dept-syllabus-card {
            background: #ffffff;
            border: 1px solid var(--dept-syllabus-border);
            border-radius: var(--dept-syllabus-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-container.grid-view .dept-syllabus-card:hover {
            border-color: var(--dept-syllabus-primary);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        /* Card Elements */
        .dept-syllabus-card-left {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .dept-syllabus-pdf-icon {
            font-size: 1.8rem;
            color: #e11d48;
            margin-top: 2px;
        }

        .dept-syllabus-course-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0645ad;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .dept-syllabus-meta-text {
            font-size: 0.85rem;
            color: var(--dept-syllabus-text-muted);
        }

        .dept-syllabus-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .dept-syllabus-container.grid-view .dept-syllabus-actions {
            border-top: 1px solid #eaecf0;
            padding-top: 12px;
            justify-content: flex-end;
        }

        .dept-syllabus-btn {
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--dept-syllabus-border);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f8f9fa;
            color: var(--dept-syllabus-text);
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-btn:hover {
            background: #eaecf0;
            border-color: #72777d;
        }

        .dept-syllabus-btn-download {
            background: var(--dept-syllabus-primary-light);
            color: var(--dept-syllabus-primary-dark);
            border-color: #a7f3d0;
        }

        .dept-syllabus-btn-download:hover {
            background: #d1fae5;
            border-color: var(--dept-syllabus-primary);
        }

        /* Empty State */
        .dept-syllabus-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--dept-syllabus-text-muted);
            border: 1px dashed var(--dept-syllabus-border);
            border-radius: var(--dept-syllabus-radius);
            background: #fafbfc;
        }

        /* Modal Preview Overlay */
        .dept-syllabus-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: var(--dept-syllabus-transition);
            backdrop-filter: blur(2px);
        }

        .dept-syllabus-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .dept-syllabus-modal-header {
            background: #ffffff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--dept-syllabus-border);
        }

        .dept-syllabus-modal-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .dept-syllabus-modal-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--dept-syllabus-text-muted);
            transition: var(--dept-syllabus-transition);
        }

        .dept-syllabus-modal-close:hover {
            color: #000;
        }

        .dept-syllabus-modal-body {
            flex: 1;
            background: #e5e7eb;
        }

        .dept-syllabus-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Toast Feedback Notification */
        .dept-syllabus-toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #1e293b;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.85rem;
            z-index: 2000;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--dept-syllabus-transition);
            pointer-events: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .dept-syllabus-toast.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .dept-syllabus-wrapper {
                padding: 20px;
            }
            .dept-syllabus-container.list-view .dept-syllabus-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .dept-syllabus-container.list-view .dept-syllabus-actions {
                width: 100%;
                justify-content: flex-end;
                border-top: 1px solid #eaecf0;
                padding-top: 10px;
            }
        }
    </style>
</head>

        let deptCurrentProgramme = "All";
        let deptCurrentSemester = "All";
        let deptCurrentPattern = "";
        let deptSearchQuery = "";
        let deptCurrentView = "list"; // 'list' or 'grid'

        const deptContainer = document.getElementById("dept-syllabus-container");
        const deptSearchInput = document.getElementById("dept-syllabus-search-input");
        const deptPatternSelect = document.getElementById("dept-syllabus-pattern-select");
        const deptResetBtn = document.getElementById("dept-syllabus-btn-reset");
        const deptProgrammeTabs = document.getElementById("dept-syllabus-programme-tabs");
        const deptSemesterTabs = document.getElementById("dept-syllabus-semester-tabs");
        
        const deptViewListBtn = document.getElementById("dept-view-list");
        const deptViewGridBtn = document.getElementById("dept-view-grid");

        const deptModal = document.getElementById("dept-syllabus-preview-modal");
        const deptIframe = document.getElementById("dept-syllabus-iframe");
        const deptModalTitle = document.getElementById("dept-syllabus-modal-title");
        const deptModalClose = document.getElementById("dept-syllabus-modal-close");
        const deptToast = document.getElementById("dept-syllabus-toast");

        function deptRender() {
            const filtered = deptSyllabusData.filter(item => {
                const matchProg = deptCurrentProgramme === "All" || item.programme === deptCurrentProgramme;
                const matchSem = deptCurrentSemester === "All" || item.semester === deptCurrentSemester;
                const matchPat = !deptCurrentPattern || item.pattern === deptCurrentPattern;
                const matchSearch = !deptSearchQuery || 
                    item.course.toLowerCase().includes(deptSearchQuery.toLowerCase()) ||
                    item.code.toLowerCase().includes(deptSearchQuery.toLowerCase());
                return matchProg && matchSem && matchPat && matchSearch;
            });

            deptContainer.innerHTML = "";

            if (filtered.length === 0) {
                deptContainer.innerHTML = `<div class="dept-syllabus-empty"><i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>No syllabus documents available matching your criteria.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement("div");
                card.className = "dept-syllabus-card";
                card.innerHTML = `
                    <div class="dept-syllabus-card-left">
                        <div class="dept-syllabus-pdf-icon"><i class="fa-solid fa-file-pdf"></i></div>
                        <div>
                            <div class="dept-syllabus-course-title">${item.course}</div>
                            <div class="dept-syllabus-meta-text">
                                <strong>Code:</strong> ${item.code} &bull; 
                                <strong>Prog:</strong> ${item.programme} &bull; 
                                <strong>Sem:</strong> ${item.semester} &bull; 
                                <strong>Credits:</strong> ${item.credits} (${item.pdfSize})
                            </div>
                        </div>
                    </div>
                    <div class="dept-syllabus-actions">
                        <button class="dept-syllabus-btn" onclick="deptOpenPreview('${item.pdf}', '${item.course}')">
                            <i class="fa-solid fa-eye"></i> Preview
                        </button>
                        <button class="dept-syllabus-btn dept-syllabus-btn-download" onclick="deptDownload('${item.pdf}', '${item.code}.pdf')">
                            <i class="fa-solid fa-download"></i> Download
                        </button>
                        <button class="dept-syllabus-btn" onclick="deptShare('${item.course}')" title="Copy Link">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>
                `;
                deptContainer.appendChild(card);
            });
        }

        // View Switch Logic
        deptViewListBtn.addEventListener("click", () => {
            deptCurrentView = "list";
            deptContainer.className = "dept-syllabus-container list-view";
            deptViewListBtn.classList.add("active");
            deptViewGridBtn.classList.remove("active");
        });

        deptViewGridBtn.addEventListener("click", () => {
            deptCurrentView = "grid";
            deptContainer.className = "dept-syllabus-container grid-view";
            deptViewGridBtn.classList.add("active");
            deptViewListBtn.classList.remove("active");
        });

        window.deptOpenPreview = function(url, title) {
            deptModalTitle.textContent = title;
            deptIframe.src = url;
            deptModal.classList.add("active");
        };

        deptModalClose.addEventListener("click", () => {
            deptModal.classList.remove("active");
            deptIframe.src = "";
        });

        window.deptDownload = function(url, filename) {
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.target = "_blank";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        window.deptShare = function(title) {
            navigator.clipboard.writeText(window.location.href).then(() => {
                deptToast.classList.add("active");
                setTimeout(() => deptToast.classList.remove("active"), 2200);
            });
        };

        deptProgrammeTabs.addEventListener("click", e => {
            if (e.target.classList.contains("dept-syllabus-tab")) {
                Array.from(deptProgrammeTabs.children).forEach(t => t.classList.remove("active"));
                e.target.classList.add("active");
                deptCurrentProgramme = e.target.getAttribute("data-programme");
                deptRender();
            }
        });

        deptSemesterTabs.addEventListener("click", e => {
            if (e.target.classList.contains("dept-syllabus-tab")) {
                Array.from(deptSemesterTabs.children).forEach(t => t.classList.remove("active"));
                e.target.classList.add("active");
                deptCurrentSemester = e.target.getAttribute("data-semester");
                deptRender();
            }
        });

        deptSearchInput.addEventListener("input", e => {
            deptSearchQuery = e.target.value.trim();
            deptRender();
        });

        deptPatternSelect.addEventListener("change", e => {
            deptCurrentPattern = e.target.value;
            deptRender();
        });

        deptResetBtn.addEventListener("click", () => {
            deptSearchInput.value = "";
            deptPatternSelect.value = "";
            deptSearchQuery = "";
            deptCurrentPattern = "";
            deptCurrentProgramme = "All";
            deptCurrentSemester = "All";
            Array.from(deptProgrammeTabs.children).forEach(t => t.classList.toggle("active", t.getAttribute("data-programme") === "All"));
            Array.from(deptSemesterTabs.children).forEach(t => t.classList.toggle("active", t.getAttribute("data-semester") === "All"));
            deptRender();
        });

        document.addEventListener("DOMContentLoaded", deptRender);
    </script>
