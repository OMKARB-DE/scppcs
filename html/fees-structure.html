<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fee Structures - Shri Shivaji College, Parbhani</title>
  
  <link rel="stylesheet" href="../css/fees-structure.css">

  <!-- Google Fonts for Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Advanced Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  
</head>
<body>


  <!-- HEADER COMPONENT MOUNT POINT -->
  <header id="departmentHeader"></header>



  <div class="wiki-container">
    
    <header class="wiki-header">
      <div class="wiki-header-meta">M.S.P. Mandal's</div>
      <h1 class="wiki-title">Shri Shivaji College, Parbhani</h1>
      <p class="wiki-subtitle">Academic Fee Structure & Itemized Breakdown — Academic Year 2026–27</p>
    </header>

    <!-- Controls & Program Switcher -->
    <div class="wiki-controls-card">
      <div class="wiki-search-row">
        <div class="wiki-tab-group">
          <button class="wiki-tab-btn active" id="tabUgBtn">
            <i class="fa-solid fa-graduation-cap"></i> Undergraduate Courses (UG)
          </button>
          <button class="wiki-tab-btn" id="tabPgBtn">
            <i class="fa-solid fa-user-graduate"></i> Postgraduate Courses (PG)
          </button>
        </div>

        <div class="wiki-action-group">
          <button class="wiki-action-btn" id="printBtn"><i class="fa-solid fa-print"></i> Print / Export PDF</button>
        </div>
      </div>

      <div class="wiki-filter-row">
        <div class="wiki-filter-item">
          <label for="courseSelect" class="wiki-label"><i class="fa-solid fa-book"></i> Select Course:</label>
          <select id="courseSelect" class="wiki-select">
            <!-- Dynamically populated via JS -->
          </select>
        </div>

        <div class="wiki-filter-item">
          <label for="categorySelect" class="wiki-label"><i class="fa-solid fa-tags"></i> Category / Quota:</label>
          <select id="categorySelect" class="wiki-select">
            <option value="PAYING">Paying / General</option>
            <option value="EBC">EBC / Reserved</option>
          </select>
        </div>
      </div>
    </div>

    <!-- MAIN PAGE SUMMARY SECTION: Course Wise Total Fees -->
    <section class="wiki-content-block">
      <h2 class="wiki-block-title"><i class="fa-solid fa-wallet"></i> Overview: Total Course Fees (Category-Wise)</h2>
      <div class="fee-summary-grid" id="courseSummaryGrid">
        <!-- Dynamically Generated Summary Cards -->
      </div>
    </section>

    <!-- ITEMIZATION SECTION: Complete Breakdown of Fees -->
    <section class="wiki-content-block">
      <div class="block-header-flex">
        <h2 class="wiki-block-title" id="breakdownTitle">Itemized Fee Structure Breakdown</h2>
      </div>

      <div class="wiki-table-wrapper">
        <table class="wiki-table breakdown-table" id="feeBreakdownTable">
          <thead id="feeTableHeader">
            <!-- Dynamically Generated -->
          </thead>
          <tbody id="feeTableBody">
            <!-- Dynamically Generated -->
          </tbody>
          <tfoot id="feeTableFooter">
            <!-- Dynamically Generated Totals -->
          </tfoot>
        </table>
      </div>
    </section>

  </div>





  <!-- FOOTER COMPONENT MOUNT POINT -->
<footer id="departmentFooter"></footer>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Load Footer Component
        fetch("../components/footer.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("departmentFooter").innerHTML = html;
                
                // Inject Footer Scoped Stylesheet
                const css = document.createElement("link");
                css.rel = "stylesheet";
                css.href = "../css/footer.css";
                document.head.appendChild(css);

                // Initialize Footer Scripts
                if (typeof loadDepartmentFooter === 'function') {
                    loadDepartmentFooter();
                }
            })
            .catch(err => console.error("Error loading footer component:", err));
    });
</script>


<!-- COMPONENT LOADER SCRIPT -->
    <script src="../js/header.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("../components/header.html")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("departmentHeader").innerHTML = html;
                    
                    // Dynamically attach scoped stylesheet
                    const css = document.createElement("link");
                    css.rel = "stylesheet";
                    css.href = "../css/header.css";
                    document.head.appendChild(css);

                    // Initialize JavaScript features
                    loadDepartmentHeader();
                })
                .catch(err => console.error("Error loading header component:", err));
        });
    </script>

  <script src="../js/fees-structure.js"></script>
</body>
</html>
