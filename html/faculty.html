<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Directory - Department of Computer Science</title>
    <link rel="stylesheet" href="faculty.css">
</head>
<body>

    <!-- PAGE HEADER -->
    <header class="csfaculty-header">
        <div class="csfaculty-container">
            <div class="csfaculty-breadcrumb">
                Home > Faculty
            </div>
            <h1 class="csfaculty-title">Faculty Directory</h1>
            <p class="csfaculty-subtitle">Department of Computer Science</p>
            
            <!-- Department Statistics -->
            <div class="csfaculty-stats-bar">
                <div class="csfaculty-stat-item">
                    <span class="csfaculty-stat-num" id="csfaculty-total-count">15</span>
                    <span class="csfaculty-stat-label">Faculty Count</span>
                </div>
                <div class="csfaculty-stat-item">
                    <span class="csfaculty-stat-num">5</span>
                    <span class="csfaculty-stat-label">Professors</span>
                </div>
                <div class="csfaculty-stat-item">
                    <span class="csfaculty-stat-num">4</span>
                    <span class="csfaculty-stat-label">Associate Professors</span>
                </div>
                <div class="csfaculty-stat-item">
                    <span class="csfaculty-stat-num">4</span>
                    <span class="csfaculty-stat-label">Assistant Professors</span>
                </div>
                <div class="csfaculty-stat-item">
                    <span class="csfaculty-stat-num">2</span>
                    <span class="csfaculty-stat-label">Visiting Faculty</span>
                </div>
            </div>

            <!-- Search and Filters -->
            <div class="csfaculty-controls">
                <div class="csfaculty-search-box">
                    <input type="text" id="csfaculty-search-input" placeholder="Search by name, qualification, research area, designation...">
                </div>
                <div class="csfaculty-filters">
                    <select id="csfaculty-filter-designation">
                        <option value="">All Designations</option>
                        <option value="Professor">Professor</option>
                        <option value="Associate Professor">Associate Professor</option>
                        <option value="Assistant Professor">Assistant Professor</option>
                        <option value="Visiting Faculty">Visiting Faculty</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN DIRECTORY GRID -->
    <main class="csfaculty-main csfaculty-container">
        <div id="csfaculty-grid" class="csfaculty-grid">
            <!-- Dynamically populated via JS -->
        </div>
    </main>

    <!-- COMPLETE PROFILE MODAL -->
    <div id="csfaculty-modal" class="csfaculty-modal" role="dialog" aria-hidden="true">
        <div class="csfaculty-modal-content">
            <button class="csfaculty-modal-close" id="csfaculty-modal-close" aria-label="Close modal">&times;</button>
            
            <!-- Profile Header -->
            <div class="csfaculty-modal-header" id="csfaculty-modal-header">
                <!-- Dynamically populated -->
            </div>

            <!-- Sticky Horizontal Navigation Tabs -->
            <nav class="csfaculty-modal-tabs" id="csfaculty-modal-tabs">
                <button class="csfaculty-tab-btn active" data-tab="overview">Overview</button>
                <button class="csfaculty-tab-btn" data-tab="biography">Biography</button>
                <button class="csfaculty-tab-btn" data-tab="education">Education</button>
                <button class="csfaculty-tab-btn" data-tab="experience">Experience</button>
                <button class="csfaculty-tab-btn" data-tab="teaching">Teaching</button>
                <button class="csfaculty-tab-btn" data-tab="research">Research</button>
                <button class="csfaculty-tab-btn" data-tab="publications">Publications</button>
                <button class="csfaculty-tab-btn" data-tab="projects">Projects</button>
                <button class="csfaculty-tab-btn" data-tab="achievements">Achievements</button>
                <button class="csfaculty-tab-btn" data-tab="gallery">Gallery</button>
                <button class="csfaculty-tab-btn" data-tab="downloads">Downloads</button>
                <button class="csfaculty-tab-btn" data-tab="contact">Contact</button>
            </nav>

            <!-- Tab Content Panes -->
            <div class="csfaculty-modal-body" id="csfaculty-modal-body">
                <!-- Dynamically displayed based on active tab -->
            </div>

            <!-- Modal Footer Action Bar -->
            <div class="csfaculty-modal-footer">
                <button class="csfaculty-action-btn" id="csfaculty-btn-email">Send Email</button>
                <button class="csfaculty-action-btn" id="csfaculty-btn-appointment">Request Appointment</button>
                <button class="csfaculty-action-btn" id="csfaculty-btn-cv">Download CV</button>
                <button class="csfaculty-action-btn" id="csfaculty-btn-print">Print Profile</button>
                <button class="csfaculty-action-btn" id="csfaculty-btn-share">Share Profile</button>
                <button class="csfaculty-action-btn" id="csfaculty-btn-copy">Copy Contact</button>
            </div>
        </div>
    </div>

    <script src="faculty.js"></script>
</body>
</html>
